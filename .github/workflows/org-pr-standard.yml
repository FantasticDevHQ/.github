# Required on every FantasticDevHQ repository by the organization ruleset
# "PR standard". It runs in the target repository but executes only this
# repository's trusted validator, with a read-only token. A failing run blocks
# the merge and explains every problem in the job summary.
name: Org PR standard
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  merge_group:
permissions:
  contents: read
  pull-requests: read
jobs:
  pr-standard:
    name: Org PR standard
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FantasticDevHQ/.github
          ref: main
          path: standard
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node standard/scripts/org-pr-check.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
