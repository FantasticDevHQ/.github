name: Bug report
description: The project does not behave as its documentation says.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A minimal reproduction is the fastest route to a fix.
        **Security problems do not belong here**: use the repository's Security tab and choose "Report a vulnerability".
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues, including closed ones.
          required: true
        - label: I can reproduce this on the latest release or the default branch.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version, release tag or commit SHA.
      placeholder: "1.4.2"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime and version, package manager, and any host framework or service versions that matter (for example Convex, Effect, Stripe API version).
      placeholder: |
        OS: macOS 15.1
        Runtime: Node.js 22.18.0
        Package manager: pnpm 10.4.0
        Host: convex 1.27.0
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the exact error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Link the documentation that describes the expected behavior, if any.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, code or a link to a minimal repository that shows the problem.
      placeholder: |
        1. pnpm add @fantastic.dev/example
        2. Add the following config ...
        3. Run ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste output here. It is rendered as code, so no backticks are needed. Remove secrets and personal data.
      render: shell
  - type: dropdown
    id: agent
    attributes:
      label: Coding agent involvement
      description: Agent-written reports are welcome. A person must have confirmed the reproduction.
      options:
        - No agent was involved
        - An agent hit this while using the project
        - An agent wrote this report and I confirmed it
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to fix this?
      options:
        - "No"
        - Yes, with some guidance
        - Yes, I can open a pull request
